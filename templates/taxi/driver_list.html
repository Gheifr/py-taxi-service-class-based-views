{% extends "base.html" %}
{% block content %}
  <h1>Drivers</h1>
  {% if driver_list %}
    <table>
      <tr>
        <td>Username</td>
        <td>Full name</td>
        <td>License</td>
      </tr>
      {% for driver in driver_list %}
        <tr>
          <td><a href="{{ driver.get_absolute_url }}">{{ driver.username }}</a></td>
          <td>{{ driver.get_full_name }}</td>
          <td>{{ driver.license_number }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p class="no-items">No drivers at the moment</p>
  {% endif %}

{% endblock %}
