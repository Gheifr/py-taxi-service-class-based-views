{% extends "base.html" %}
{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
    <table>
    <tr>
          <td>Id</td>
          <td>Model</td>
          <td>Manufacturer</td>
        </tr>
      {% for car in car_list %}
        <tr>
          <td><a href="{{ car.get_absolute_url }}">{{ car.id }}</a></td>
          <td>{{ car.model }}</td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p class="no-items">No cars at the moment</p>
  {% endif %}

{% endblock %}
