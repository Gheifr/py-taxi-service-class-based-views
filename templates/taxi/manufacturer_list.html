{% extends "base.html" %}

{% block content %}

  <h1>Manufacturers</h1>
  {% if manufacturer_list %}
    <ul>
      {% for manufacturer in manufacturer_list %}
        <li>{{ manufacturer.name }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="no-items">No manufacturers at the moment</p>
  {% endif %}

{% endblock %}
